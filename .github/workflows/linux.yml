name: linux

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'np/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux lab
    runs-on: ubuntu-24.04
    steps:
      - name: Check out lab
        uses: actions/checkout@v4
        with:
          path: desktop-auth-lab

      - name: Check out package fork
        uses: actions/checkout@v4
        with:
          repository: neeraj-pilot/flutter_local_authentication
          ref: np/linux-pam-auth
          path: flutter_local_authentication

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libpam0g-dev \
            libsecret-1-dev \
            ninja-build \
            pkg-config

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Test package fork
        working-directory: flutter_local_authentication
        run: |
          flutter pub get
          flutter test

      - name: Get lab dependencies
        working-directory: desktop-auth-lab
        run: flutter pub get

      - name: Check formatting
        working-directory: desktop-auth-lab
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze lab
        working-directory: desktop-auth-lab
        run: flutter analyze

      - name: Test lab
        working-directory: desktop-auth-lab
        run: flutter test

      - name: Capture host diagnostics
        working-directory: desktop-auth-lab
        run: |
          mkdir -p artifacts
          dart run tool/host_diagnostics.dart > artifacts/host_diagnostics.json

      - name: Build Linux release
        working-directory: desktop-auth-lab
        run: flutter build linux --release

      - name: Capture binary linkage
        working-directory: desktop-auth-lab
        run: ldd build/linux/x64/release/bundle/desktop_auth_lab > artifacts/ldd.txt

      - name: Upload Linux bundle and logs
        uses: actions/upload-artifact@v4
        with:
          name: desktop-auth-lab-linux
          path: |
            desktop-auth-lab/build/linux/x64/release/bundle
            desktop-auth-lab/artifacts
