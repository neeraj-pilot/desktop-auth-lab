name: desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "np/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.10"

jobs:
  linux:
    name: Linux and Flatpak
    runs-on: ubuntu-22.04
    steps:
      - name: Check out lab
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            flatpak \
            flatpak-builder \
            libarchive-tools \
            libayatana-appindicator3-dev \
            libcurl4-openssl-dev \
            libffi-dev \
            libfuse2 \
            libgtk-3-dev \
            libsecret-1-dev \
            libsodium-dev \
            libsqlite3-dev \
            libtiff5 \
            locate \
            lld \
            ninja-build \
            patchelf \
            pkg-config \
            rpm \
            xz-utils
          sudo updatedb --localpaths='/usr/lib/x86_64-linux-gnu'

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Check vendored Linux package
        working-directory: packages/local_auth_linux
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed .
          flutter analyze --no-fatal-infos
          flutter test

      - name: Check lab
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed .
          flutter analyze --no-fatal-infos
          flutter test

      - name: Capture host diagnostics
        run: |
          mkdir -p artifacts
          dart run tool/host_diagnostics.dart > artifacts/host_diagnostics.json

      - name: Build Linux release
        run: flutter build linux --release

      - name: Capture Linux linkage
        run: ldd build/linux/x64/release/bundle/desktop_auth_lab > artifacts/ldd.txt

      - name: Package Linux bundle
        run: tar -C build/linux/x64/release -czf artifacts/desktop-auth-lab-linux-x64.tar.gz bundle

      - name: Build Flatpak bundle
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//46 org.gnome.Sdk//46
          flatpak-builder --force-clean --repo=artifacts/flatpak-repo build/flatpak-build flatpak/io.ente.authlab.yml
          flatpak build-bundle artifacts/flatpak-repo artifacts/desktop-auth-lab.flatpak io.ente.authlab
          mkdir -p artifacts/flatpak-test-kit
          cp -R flatpak/. artifacts/flatpak-test-kit/
          cp assets/polkit/io.ente.auth.policy artifacts/flatpak-test-kit/io.ente.auth.policy
          mkdir -p artifacts/desktop-auth-lab-flatpak-test
          cp artifacts/desktop-auth-lab.flatpak artifacts/desktop-auth-lab-flatpak-test/
          cp flatpak/README.md artifacts/desktop-auth-lab-flatpak-test/README.md
          cp flatpak/install-polkit-policy.sh artifacts/desktop-auth-lab-flatpak-test/
          cp flatpak/uninstall-polkit-policy.sh artifacts/desktop-auth-lab-flatpak-test/
          cp assets/polkit/io.ente.auth.policy artifacts/desktop-auth-lab-flatpak-test/
          cp flatpak/io.ente.authlab.yml artifacts/desktop-auth-lab-flatpak-test/
          cp flatpak/io.ente.authlab.desktop artifacts/desktop-auth-lab-flatpak-test/
          cp flatpak/io.ente.authlab.metainfo.xml artifacts/desktop-auth-lab-flatpak-test/
          tar -C artifacts -czf artifacts/desktop-auth-lab-flatpak-test.tar.gz desktop-auth-lab-flatpak-test

      - name: Capture Linux checksums
        run: |
          sha256sum \
            artifacts/desktop-auth-lab-linux-x64.tar.gz \
            artifacts/desktop-auth-lab.flatpak \
            artifacts/desktop-auth-lab-flatpak-test.tar.gz \
            > artifacts/desktop-auth-lab-sha256.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-auth-lab-linux
          path: |
            artifacts/desktop-auth-lab-linux-x64.tar.gz
            artifacts/host_diagnostics.json
            artifacts/ldd.txt
            artifacts/desktop-auth-lab-sha256.txt

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-auth-lab-flatpak
          path: |
            artifacts/desktop-auth-lab.flatpak
            artifacts/desktop-auth-lab-flatpak-test.tar.gz
            artifacts/desktop-auth-lab-flatpak-test
            artifacts/flatpak-test-kit

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Check out lab
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check lab
        run: |
          flutter config --enable-windows-desktop
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed .
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows app
        run: |
          New-Item -ItemType Directory -Force artifacts
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath artifacts/desktop-auth-lab-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-auth-lab-windows
          path: artifacts/desktop-auth-lab-windows-x64.zip

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - name: Check out lab
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check lab
        run: |
          flutter config --enable-macos-desktop
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed .
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/desktop_auth_lab.app artifacts/desktop-auth-lab-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-auth-lab-macos
          path: artifacts/desktop-auth-lab-macos.zip
